services:
  - type: web
    name: vibe-finder-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1 worker + threads: o SQLite local nao aguenta escrita concorrente de
    # varios processos (database is locked). Threads bastam para I/O-bound.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false          # definir manualmente no painel, nao no git
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
